name: Build & Upload to App Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEV_TEAM: 9L6N2ZF26B
  ASC_USER: support@techidaily.com
  PLATFORM: ios

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Apple Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="buildkeychain$(date +%s)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" ~/build-keychain.keychain
          security set-keychain-settings -t 3600 -u ~/build-keychain.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ~/build-keychain.keychain
          
          echo "$CERTIFICATE_BASE64" | base64 -d -o /tmp/certificate.p12
          security import /tmp/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k ~/build-keychain.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" ~/build-keychain.keychain
          security list-keychains -s ~/build-keychain.keychain
          security default-keychain -s ~/build-keychain.keychain

      - name: Setup XcodeGen
        run: |
          mkdir -p ~/tools
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.45.0/XcodeGen-2.45.0-macOS-arm64.tar.gz | tar -xz -C ~/tools
          ls -la ~/tools/
          ls -la ~/tools/XcodeGen.app/Contents/MacOS/
          echo "~/tools/XcodeGen.app/Contents/MacOS" >> $GITHUB_PATH

      - name: Verify XcodeGen
        run: xcodegen version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la ParallelU.xcodeproj
        working-directory: ${{ github.workspace }}/ParallelU

      - name: Build (Release)
        run: |
          xcodebuild -project ParallelU.xcodeproj \
            -scheme ParallelU \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=${{ env.DEV_TEAM }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ID="Apple Distribution: ZhiFeng Sun (9L6N2ZF26B)" \
            CODE_SIGNING_KEYCHAIN=~/build-keychain.keychain \
            CODE_SIGNING_ALLOWED=YES \
            archive \
            -archivePath ./ParallelU.xcarchive
        working-directory: ${{ github.workspace }}/ParallelU

      - name: Upload to App Store Connect
        env:
          ASC_PASS: ${{ secrets.ASC_APP_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            -f ./ParallelU.xcarchive \
            -t ${{ env.PLATFORM }} \
            -u ${{ env.ASC_USER }} \
            -p "$ASC_PASS" \
            --provider ${{ env.DEV_TEAM }} \
            --bundle-id com.ggsheng.ParallelU \
            --apple-id 6762428992
        working-directory: ${{ github.workspace }}/ParallelU

      - name: Build summary
        run: |
          echo "## ✅ Build & Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "- App: ParallelU" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
