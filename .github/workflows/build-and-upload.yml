name: Build & Upload to App Store

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  DEV_TEAM: 9L6N2ZF26B
  ASC_USER: support@techidaily.com
  PLATFORM: ios
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup XcodeGen
        run: |
          mkdir -p ~/tools
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip -o xcodegen.zip && unzip -o xcodegen.zip -d ~/tools && rm xcodegen.zip && chmod +x ~/tools/xcodegen/xcodegen
          echo "~/tools" >> $GITHUB_PATH
        working-directory: /tmp

      - name: Verify XcodeGen
        run: xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ${{ github.workspace }}

      - name: Build (Release)
        run: |
          xcodebuild -project ParallelU.xcodeproj \
            -scheme ParallelU \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=${{ env.DEV_TEAM }} \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            archive \
            -archivePath ./ParallelU.xcarchive
        working-directory: ${{ github.workspace }}

      - name: Upload to App Store Connect
        env:
          ASC_PASS: ${{ secrets.ASC_APP_PASSWORD }}
        run: |
          echo "=== Uploading to App Store Connect ==="
          xcrun altool --upload-app \
            -f ./ParallelU.xcarchive \
            -t ${{ env.PLATFORM }} \
            -u ${{ env.ASC_USER }} \
            -p "$ASC_PASS" \
            --provider ${{ env.DEV_TEAM }} \
            --bundle-id com.ggsheng.ParallelU \
            --apple-id 6762428992
        working-directory: ${{ github.workspace }}

      - name: Build summary
        run: |
          echo "## ✅ Build & Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "- App: ParallelU" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next step: Go to App Store Connect to add TestFlight testers and submit for review." >> $GITHUB_STEP_SUMMARY
