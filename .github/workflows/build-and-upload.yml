name: Build & Upload to App Store

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  DEV_TEAM: 9L6N2ZF26B
  PLATFORM: ios
  ASC_ISSUER: b2a00f88-3a8d-40d0-b148-1f1db92e10b7
  ASC_KEY_ID: PP57R568AX
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup XcodeGen
        run: |
          mkdir -p ~/tools/xcodegen
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -o /tmp/xcodegen.zip -d ~/tools/xcodegen
          rm /tmp/xcodegen.zip
          chmod +x ~/tools/xcodegen/xcodegen/bin/xcodegen
          echo "~/tools/xcodegen/xcodegen/bin" >> $GITHUB_PATH
        working-directory: /tmp

      - name: Verify XcodeGen
        run: xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ${{ github.workspace }}

      - name: Create API Key file
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ env.ASC_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ env.ASC_KEY_ID }}.p8
        working-directory: /tmp

      - name: Build (Release)
        env:
          ASC_PRIVATE_KEY_PATH: ~/private_keys/AuthKey_${{ env.ASC_KEY_ID }}.p8
        run: |
          xcodebuild -project ParallelU.xcodeproj \
            -scheme ParallelU \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=${{ env.DEV_TEAM }} \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_PRIVATE_KEY_PATH" \
            -authenticationKeyID ${{ env.ASC_KEY_ID }} \
            -authenticationKeyIssuer ${{ env.ASC_ISSUER }} \
            archive \
            -archivePath ./ParallelU.xcarchive
        working-directory: ${{ github.workspace }}

      - name: Upload to App Store Connect
        env:
          ASC_PRIVATE_KEY_PATH: ~/private_keys/AuthKey_${{ env.ASC_KEY_ID }}.p8
        run: |
          echo "=== Uploading to App Store Connect ==="
          xcrun altool --upload-app \
            -f ./ParallelU.xcarchive \
            -t ${{ env.PLATFORM }} \
            --provider ${{ env.DEV_TEAM }} \
            --bundle-id com.ggsheng.ParallelU \
            --apple-id 6762428992 \
            --api-key "$ASC_PRIVATE_KEY_PATH" \
            --api-key-id ${{ env.ASC_KEY_ID }} \
            --api-issuer ${{ env.ASC_ISSUER }}
        working-directory: ${{ github.workspace }}

      - name: Build summary
        run: |
          echo "## ✅ Build & Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "- App: ParallelU" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next step: Go to App Store Connect to add TestFlight testers and submit for review." >> $GITHUB_STEP_SUMMARY
