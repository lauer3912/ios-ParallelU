name: ParallelU
options:
  bundleIdPrefix: com.ggsheng
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9L6N2ZF26B
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ParallelU:
    type: application
    platform: iOS
    sources:
      - path: ParallelU
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: ParallelU/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.ParallelU
        PRODUCT_NAME: ParallelU
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: ParallelU/ParallelU.entitlements
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: 9L6N2ZF26B
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
    entitlements:
      path: ParallelU/ParallelU.entitlements
    dependencies:
      - target: ParallelUWidget
        embed: true

  ParallelUWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ParallelUWidget
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: ParallelUWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.ParallelU.widget
        PRODUCT_NAME: ParallelUWidget
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: ParallelUWidget/ParallelUWidget.entitlements
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: 9L6N2ZF26B
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
    entitlements:
      path: ParallelUWidget/ParallelUWidget.entitlements

  ParallelUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParallelUTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: ParallelU
    settings:
      base:
        INFOPLIST_FILE: ParallelUTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.ParallelUTests
        PRODUCT_NAME: ParallelUTests
        GENERATE_INFOPLIST_FILE: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ParallelU.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ParallelU"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L6N2ZF26B

  ParallelUUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParallelUUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: ParallelU
    settings:
      base:
        INFOPLIST_FILE: ParallelUUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.ParallelUUITests
        PRODUCT_NAME: ParallelUUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET: "$(BUILT_PRODUCTS_DIR)/ParallelU.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ParallelU"
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L6N2ZF26B

schemes:
  ParallelU:
    build:
      targets:
        ParallelU: all
        ParallelUWidget: all
        ParallelUUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ParallelUUITests
    archive:
      config: Release